# Skickar en notis till mobilen (via ntfy) när morgondagen blir dyr för huset,
# eller när ett dyrt dygn väntas om tre dagar. Två schemalagda körningar, 11:40 och
# 12:40 UTC, motsvarar 13:40 svensk tid på sommar- respektive vintertid. Skriptet
# avgör utifrån vilken cron som startade körningen om den ska skicka (aldrig båda),
# och väntar in morgondagens priser i upp till en timme om de publiceras sent.
#
# Inställning: lägg ämnesnamnet som hemlighet NTFY_TOPIC (Settings → Secrets and
# variables → Actions). Utan den skrivs notisen bara ut i loggen.
name: Varna för dyr el

on:
  schedule:
    - cron: '40 11 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch:
    inputs:
      tvinga:
        description: 'Skicka även utanför tidsfönstret (för test)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  varna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kontrollera morgondagen och skicka varning
        timeout-minutes: 75
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://dalarud.github.io/elpris/
          SCHEMA: ${{ github.event.schedule }}
        run: node tools/notis.mjs ${{ (github.event_name == 'schedule' || !inputs.tvinga) && '--schemalagd' || '' }}
