# Publicerar webbappen (mappen app/) på GitHub Pages och uppdaterar prishistoriken
# varje dag. Kräver att Pages är påslaget med källan "GitHub Actions"
# (Settings → Pages).
name: Publicera Elkollen

on:
  push:
    branches: [main]
    paths: ['app/**', 'tools/**', 'data/**', '.github/workflows/sida.yml']
  schedule:
    - cron: '30 2 * * *'   # varje natt, uppdaterar historiken
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester
        run: npm test
      - name: Bygg prishistorik och temperaturer
        run: node tools/bygg_data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

  hall-igang:
    # GitHub stänger av schemalagda arbetsflöden i publika repon efter 60 dagar
    # utan aktivitet. Att aktivera dem på nytt varje natt (samma metod som
    # keepalive-workflow i API-läge) håller notiserna och datauppdateringen igång.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Håll de schemalagda arbetsflödena aktiva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/varning.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sida.yml/enable"
